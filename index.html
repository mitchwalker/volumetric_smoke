<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel Smoke Prototype</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #eee; }
  #hud { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.6); padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 340px; user-select: none; }
  #hud button { background: #333; color: #eee; border: 1px solid #555; border-radius: 5px; padding: 3px 10px; margin-right: 4px; cursor: pointer; }
  #hud button.on { background: #5b8; border-color: #7da; color: #000; }
  #stats { opacity: .7; font-size: 12px; font-variant-numeric: tabular-nums; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff8; pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="hud">
  <div>
    <button data-tool="smoke" class="on">1 Smoke</button><button data-tool="rifle">2 Rifle</button><button data-tool="he">3 HE</button>
  </div>
  <div>Left click: use tool (hold to auto-fire) · Right-drag: orbit · Wheel: zoom · C: clear</div>
  <label><input type="checkbox" id="noise" checked> noise erosion</label>
  <label><input type="checkbox" id="light" checked> self-shadowing</label>
  <div id="stats"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer / scene
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fa6bf);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(-12, 6, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

const SUN_DIR = new THREE.Vector3(0.5, 1.0, 0.3).normalize();
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x4a4036, 0.9));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.4);
sun.position.copy(SUN_DIR).multiplyScalar(30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 80 });
scene.add(sun);

// ---------------------------------------------------------------------------
// Level geometry (also voxelized into the smoke grid as solid cells)
// ---------------------------------------------------------------------------
const solids = [];
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x6b6b66, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const matWall = new THREE.MeshStandardMaterial({ color: 0xa89f91, roughness: 0.9 });
const matCrate = new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 0.8 });
function box(w, h, d, x, z, mat = matWall, y = h / 2) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  solids.push(m);
}
box(0.4, 4, 8, 0, -5);              // wall with a doorway at z in [-1, 1]
box(0.4, 4, 8, 0, 5);
box(0.4, 1.2, 2, 0, 0, matWall, 3.4); // lintel
box(1.5, 1.5, 1.5, 4, 3, matCrate);
box(1.0, 1.0, 1.0, 4, 3, matCrate, 2.0);
box(1.2, 1.2, 1.2, -4, -3, matCrate);
box(5, 1.1, 0.3, -5, 4);            // low cover wall
box(0.8, 6, 0.8, 5, -5);            // pillar

// ---------------------------------------------------------------------------
// Voxel grid
// ---------------------------------------------------------------------------
const NX = 80, NY = 32, NZ = 80, CELL = 0.25;
const GMIN = new THREE.Vector3(-10, 0, -10);
const GSIZE = new THREE.Vector3(NX * CELL, NY * CELL, NZ * CELL);
const N = NX * NY * NZ;
const SXY = NX * NY;
const idx = (x, y, z) => x + NX * (y + NY * z);

const solid = new Uint8Array(N);
const dens = new Float32Array(N);    // current smoke density 0..1
const target = new Float32Array(N);  // what the grenades want each cell to be
const carved = new Uint8Array(N);    // cell was cleared by a bullet/explosion and must regrow from neighbours
const carveTime = new Float32Array(N); // sim time of the last carve, holes stay open for HOLD seconds
const blurA = new Float32Array(N), blurB = new Float32Array(N);
const texData = new Uint8Array(N);

const densTex = new THREE.Data3DTexture(texData, NX, NY, NZ);
densTex.format = THREE.RedFormat;
densTex.type = THREE.UnsignedByteType;
densTex.minFilter = densTex.magFilter = THREE.LinearFilter;
densTex.wrapS = densTex.wrapT = densTex.wrapR = THREE.ClampToEdgeWrapping;
densTex.unpackAlignment = 1;
densTex.needsUpdate = true;

// Mark every cell whose centre lies inside a solid's AABB.
{
  const bb = new THREE.Box3();
  const c = (v, o, n) => Math.min(n - 1, Math.max(0, Math.floor((v - o) / CELL)));
  for (const m of solids) {
    bb.setFromObject(m);
    for (let z = c(bb.min.z, GMIN.z, NZ); z <= c(bb.max.z, GMIN.z, NZ); z++)
      for (let y = c(bb.min.y, GMIN.y, NY); y <= c(bb.max.y, GMIN.y, NY); y++)
        for (let x = c(bb.min.x, GMIN.x, NX); x <= c(bb.max.x, GMIN.x, NX); x++) {
          const p = new THREE.Vector3(GMIN.x + (x + 0.5) * CELL, GMIN.y + (y + 0.5) * CELL, GMIN.z + (z + 0.5) * CELL);
          if (bb.containsPoint(p)) solid[idx(x, y, z)] = 1;
        }
  }
}

// ---------------------------------------------------------------------------
// Smoke grenade: Dijkstra flood fill through free cells (smoke wraps around
// cover and flows through doorways instead of clipping through walls).
// ---------------------------------------------------------------------------
class Heap {
  constructor() { this.i = []; this.d = []; }
  get size() { return this.i.length; }
  push(i, d) {
    const a = this.i, b = this.d;
    let n = a.length; a.push(i); b.push(d);
    while (n > 0) { const p = (n - 1) >> 1; if (b[p] <= d) break; a[n] = a[p]; b[n] = b[p]; n = p; }
    a[n] = i; b[n] = d;
  }
  pop() { // returns distance, index in this.top
    const a = this.i, b = this.d;
    const ti = a[0], td = b[0];
    const li = a.pop(), ld = b.pop();
    const len = a.length;
    if (len) {
      let n = 0;
      for (;;) {
        let c = 2 * n + 1; if (c >= len) break;
        if (c + 1 < len && b[c + 1] < b[c]) c++;
        if (b[c] >= ld) break;
        a[n] = a[c]; b[n] = b[c]; n = c;
      }
      a[n] = li; b[n] = ld;
    }
    this.top = ti;
    return td;
  }
}

// 26-neighbourhood; rising costs more than spreading, falling costs less, so smoke hugs the floor.
const NEIGH = [];
for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
  if (!dx && !dy && !dz) continue;
  NEIGH.push([dx, dy, dz, Math.hypot(dx, dy, dz) * (dy > 0 ? 1.35 : dy < 0 ? 0.85 : 1)]);
}

const BUDGET = 9000;        // voxels per grenade (~140 m^3)
const LIFE = 18, FADE = 4;  // seconds
const SOFT = 4;             // edge falloff in voxels
const best = new Float32Array(N), seen = new Uint32Array(N), closed = new Uint32Array(N);
let stampId = 0;
const grenades = [];
const canMat = new THREE.MeshStandardMaterial({ color: 0x3c4a3a, roughness: 0.6 });

function toCell(p) {
  return [Math.floor((p.x - GMIN.x) / CELL), Math.floor((p.y - GMIN.y) / CELL), Math.floor((p.z - GMIN.z) / CELL)];
}
const inGrid = (x, y, z) => x >= 0 && y >= 0 && z >= 0 && x < NX && y < NY && z < NZ;

function throwSmoke(p) {
  let [x, y, z] = toCell(p);
  if (!inGrid(x, 0, z)) return;
  y = Math.max(0, Math.min(NY - 1, y));
  while (y < NY - 1 && solid[idx(x, y, z)]) y++;
  const start = idx(x, y, z);
  if (solid[start]) return;

  stampId++;
  const heap = new Heap();
  best[start] = 0; seen[start] = stampId; heap.push(start, 0);
  const cells = [], dist = [];
  while (heap.size && cells.length < BUDGET) {
    const d = heap.pop(), i = heap.top;
    if (closed[i] === stampId) continue;
    closed[i] = stampId;
    cells.push(i); dist.push(d);
    const cx = i % NX, cy = ((i / NX) | 0) % NY, cz = (i / SXY) | 0;
    for (const [dx, dy, dz, cost] of NEIGH) {
      const nx = cx + dx, ny = cy + dy, nz = cz + dz;
      if (!inGrid(nx, ny, nz)) continue;
      const j = idx(nx, ny, nz);
      if (solid[j] || closed[j] === stampId) continue;
      const nd = d + cost;
      if (seen[j] !== stampId || nd < best[j]) { seen[j] = stampId; best[j] = nd; heap.push(j, nd); }
    }
  }
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.25, 12), canMat);
  can.position.set(GMIN.x + (x + 0.5) * CELL, Math.max(0.125, GMIN.y + y * CELL + 0.125), GMIN.z + (z + 0.5) * CELL);
  can.rotation.z = Math.PI / 2;
  can.castShadow = true;
  scene.add(can);
  grenades.push({ cells: Int32Array.from(cells), dist: Float32Array.from(dist), maxD: dist[dist.length - 1] + SOFT, t: 0, can });
}

// ---------------------------------------------------------------------------
// Carving: bullets cut a thin tunnel, explosions clear a sphere. Carved cells
// are flagged so they refill from their neighbours (holes close from the rim).
// ---------------------------------------------------------------------------
function carveSphere(p, r) {
  const gx = (p.x - GMIN.x) / CELL - 0.5, gy = (p.y - GMIN.y) / CELL - 0.5, gz = (p.z - GMIN.z) / CELL - 0.5;
  const r2 = r * r;
  for (let z = Math.max(0, Math.ceil(gz - r)); z <= Math.min(NZ - 1, Math.floor(gz + r)); z++)
    for (let y = Math.max(0, Math.ceil(gy - r)); y <= Math.min(NY - 1, Math.floor(gy + r)); y++)
      for (let x = Math.max(0, Math.ceil(gx - r)); x <= Math.min(NX - 1, Math.floor(gx + r)); x++) {
        const dx = x - gx, dy = y - gy, dz = z - gz;
        if (dx * dx + dy * dy + dz * dz > r2) continue;
        const i = idx(x, y, z);
        dens[i] = 0; carved[i] = 1; carveTime[i] = simTime;
      }
}
const gridBox = new THREE.Box3(GMIN.clone(), GMIN.clone().add(GSIZE)).expandByScalar(0.5);
function carveLine(a, b, r) {
  const dir = b.clone().sub(a), len = dir.length();
  dir.divideScalar(len);
  const p = new THREE.Vector3();
  for (let s = 0; s <= len; s += CELL * 0.5) {
    p.copy(a).addScaledVector(dir, s);
    if (gridBox.containsPoint(p)) carveSphere(p, r);
  }
}

// ---------------------------------------------------------------------------
// Simulation tick (fixed 30 Hz)
// ---------------------------------------------------------------------------
const HOLD = 3.0;    // seconds a carved hole stays fully open
const REGROW = 1.5; // 1/s, how fast carved cells then pull density from neighbours
let activeCells = 0, simTime = 0;

// [1 2 1] blur along one axis; three passes round off voxel corners before upload.
function blurPass(src, dst, stride, axis) {
  const n = axis === 0 ? NX : axis === 1 ? NY : NZ;
  let i = 0;
  for (let z = 0; z < NZ; z++) for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++, i++) {
    const c = axis === 0 ? x : axis === 1 ? y : z;
    const v = src[i];
    const a = c > 0 ? src[i - stride] : v, b = c < n - 1 ? src[i + stride] : v;
    dst[i] = (a + 2 * v + b) * 0.25;
  }
}

function simulate(dt) {
  simTime += dt;
  target.fill(0);
  for (let g = grenades.length - 1; g >= 0; g--) {
    const G = grenades[g];
    G.t += dt;
    if (G.t > LIFE + FADE) { scene.remove(G.can); grenades.splice(g, 1); continue; }
    const r = G.t < LIFE
      ? G.maxD * (1 - Math.exp(-G.t * 1.6))     // fast bloom, slowing down
      : G.maxD * (1 - (G.t - LIFE) / FADE);     // shrink from the outside in
    const { cells, dist } = G;
    for (let k = 0; k < cells.length; k++) {
      const v = (r - dist[k]) / SOFT;
      if (v <= 0) break; // cells are sorted by distance
      const i = cells[k];
      const tv = v > 1 ? 1 : v;
      if (tv > target[i]) target[i] = tv;
    }
  }

  activeCells = 0;
  const grow = Math.min(1, dt * 6), regrow = Math.min(1, dt * REGROW);
  let i = 0;
  for (let z = 0; z < NZ; z++) for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++, i++) {
    const t = target[i], d = dens[i];
    if (t === 0 && d === 0) { carved[i] = 0; continue; }
    activeCells++;
    if (d > t) { dens[i] = Math.max(t, d - dt * 1.2); continue; }
    if (carved[i]) {
      if (simTime - carveTime[i] < HOLD) continue;
      let m = 0;
      if (x > 0) m = Math.max(m, dens[i - 1]);
      if (x < NX - 1) m = Math.max(m, dens[i + 1]);
      if (y > 0) m = Math.max(m, dens[i - NX]);
      if (y < NY - 1) m = Math.max(m, dens[i + NX]);
      if (z > 0) m = Math.max(m, dens[i - SXY]);
      if (z < NZ - 1) m = Math.max(m, dens[i + SXY]);
      const goal = Math.min(t, m * 0.98);
      if (goal > d) dens[i] = d + (goal - d) * regrow;
      if (dens[i] >= t * 0.95) carved[i] = 0;
    } else {
      dens[i] = d + (t - d) * grow;
    }
  }
  blurPass(dens, blurA, 1, 0);
  blurPass(blurA, blurB, NX, 1);
  blurPass(blurB, blurA, SXY, 2);
  for (let k = 0; k < N; k++) texData[k] = blurA[k] * 255;
  densTex.needsUpdate = true;
}

// ---------------------------------------------------------------------------
// Rendering: scene -> render target (color + depth), then a fullscreen pass
// raymarches the density texture, stopping at scene depth.
// ---------------------------------------------------------------------------
const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
rt.depthTexture = new THREE.DepthTexture(1, 1);
rt.depthTexture.type = THREE.UnsignedIntType;

const smokeMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: {
    tScene: { value: rt.texture },
    tDepth: { value: rt.depthTexture },
    tDens: { value: densTex },
    uInvVP: { value: new THREE.Matrix4() },
    uCam: { value: new THREE.Vector3() },
    uGMin: { value: GMIN },
    uGSize: { value: GSIZE },
    uSun: { value: SUN_DIR },
    uTime: { value: 0 },
    uNoise: { value: 1 },
    uLight: { value: 1 },
  },
  vertexShader: /* glsl */`
    out vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    precision highp sampler3D;
    uniform sampler2D tScene, tDepth;
    uniform sampler3D tDens;
    uniform mat4 uInvVP;
    uniform vec3 uCam, uGMin, uGSize, uSun;
    uniform float uTime, uNoise, uLight;
    in vec2 vUv;

    float hash13(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
    float vnoise(vec3 p) {
      vec3 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(hash13(i), hash13(i + vec3(1,0,0)), f.x),
                     mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
                     mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p) {
      float s = 0.0, a = 0.5;
      for (int k = 0; k < 3; k++) { s += a * vnoise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; }
      return s / 0.875;
    }

    float rawDens(vec3 p) { return texture(tDens, (p - uGMin) / uGSize).r; }

    // Coarse voxel density eroded by animated noise: hides the grid and gives wispy edges.
    float smokeDens(vec3 p) {
      if (rawDens(p) < 0.002) return 0.0;
      // Low-frequency domain warp so edges don't follow the voxel axes.
      vec3 q = p * 0.8 + vec3(0.0, -uTime * 0.2, uTime * 0.08);
      vec3 w = vec3(vnoise(q), vnoise(q + vec3(17.3, 5.1, 9.7)), vnoise(q + vec3(3.7, 23.1, 11.3))) - 0.5;
      float d = rawDens(p + w * 0.35 * uNoise);
      if (uNoise > 0.5) {
        float n = fbm(p * 1.1 + vec3(0.0, -uTime * 0.25, uTime * 0.1));
        d = clamp((d - n * 0.55) / 0.45, 0.0, 1.0);
      }
      return d;
    }

    vec2 boxHit(vec3 ro, vec3 rd) {
      vec3 inv = 1.0 / rd;
      vec3 a = (uGMin - ro) * inv, b = (uGMin + uGSize - ro) * inv;
      vec3 lo = min(a, b), hi = max(a, b);
      return vec2(max(max(lo.x, lo.y), lo.z), min(min(hi.x, hi.y), hi.z));
    }

    void main() {
      vec3 col = texture(tScene, vUv).rgb;
      float z = texture(tDepth, vUv).x;
      vec2 ndc = vUv * 2.0 - 1.0;
      vec4 far = uInvVP * vec4(ndc, 1.0, 1.0); far /= far.w;
      vec3 rd = normalize(far.xyz - uCam);
      vec4 wp = uInvVP * vec4(ndc, z * 2.0 - 1.0, 1.0); wp /= wp.w;
      float sceneT = z >= 1.0 ? 1e6 : length(wp.xyz - uCam);

      vec2 th = boxHit(uCam, rd);
      float t0 = max(th.x, 0.0), t1 = min(th.y, sceneT);
      if (t1 > t0) {
        const int STEPS = 96;
        const float SIGMA = 5.0;  // extinction per metre at density 1
        float dt = max((t1 - t0) / float(STEPS), 0.06);
        float jitter = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
        float t = t0 + dt * jitter;
        float T = 1.0;
        vec3 L = vec3(0.0);
        vec3 sunC = vec3(1.0, 0.95, 0.85) * 2.4;
        vec3 amb = vec3(0.55, 0.62, 0.72);
        for (int i = 0; i < STEPS; i++) {
          if (t > t1 || T < 0.01) break;
          vec3 p = uCam + rd * t;
          float d = smokeDens(p);
          if (d > 0.001) {
            float sl = 1.0;
            if (uLight > 0.5) {
              float acc = 0.0;
              for (int j = 1; j <= 5; j++) acc += rawDens(p + uSun * float(j) * 0.35);
              sl = exp(-acc * 0.35 * SIGMA * 0.6);
            }
            float h = clamp((p.y - uGMin.y) / 4.0, 0.0, 1.0);
            vec3 Ls = vec3(0.85) * (sunC * sl * 0.3 + amb * mix(0.5, 1.0, h));
            float a = 1.0 - exp(-d * SIGMA * dt);
            L += T * a * Ls;
            T *= 1.0 - a;
          }
          t += dt;
        }
        col = col * T + L;
      }
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), smokeMat);
quad.frustumCulled = false;
const quadScene = new THREE.Scene();
quadScene.add(quad);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  rt.setSize(s.x, s.y);
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Interaction
// ---------------------------------------------------------------------------
let tool = 'smoke';
const buttons = document.querySelectorAll('[data-tool]');
function setTool(t) { tool = t; buttons.forEach(b => b.classList.toggle('on', b.dataset.tool === t)); }
buttons.forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
document.getElementById('noise').addEventListener('change', e => smokeMat.uniforms.uNoise.value = e.target.checked ? 1 : 0);
document.getElementById('light').addEventListener('change', e => smokeMat.uniforms.uLight.value = e.target.checked ? 1 : 0);
function clearAll() {
  for (const g of grenades) scene.remove(g.can);
  grenades.length = 0; dens.fill(0); carved.fill(0); blurA.fill(0);
}
addEventListener('keydown', e => {
  if (e.key === '1') setTool('smoke');
  if (e.key === '2') setTool('rifle');
  if (e.key === '3') setTool('he');
  if (e.key === 'c' || e.key === 'C') clearAll();
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const hitTargets = [floor, ...solids];
function pick() {
  raycaster.setFromCamera(mouse, camera);
  return raycaster.intersectObjects(hitTargets, false)[0];
}
function setMouse(e) { mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); }

const tracers = [];
const tracerMat = new THREE.LineBasicMaterial({ color: 0xffd27a, transparent: true, depthWrite: false });
function fire() {
  const hit = pick();
  const end = hit ? hit.point.clone() : raycaster.ray.at(60, new THREE.Vector3());
  const muzzle = new THREE.Vector3(0.35, -0.35, -0.5).applyMatrix4(camera.matrixWorld);
  carveLine(muzzle, end, 1.6);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([muzzle, end]), tracerMat.clone());
  scene.add(line);
  tracers.push({ line, life: 0.12 });
}

const flash = new THREE.PointLight(0xffaa55, 0, 12);
scene.add(flash);
function explode() {
  const hit = pick();
  if (!hit) return;
  const p = hit.point.clone().add(new THREE.Vector3(0, 0.3, 0));
  carveSphere(p, 3 / CELL);
  flash.position.copy(p);
  flash.intensity = 80;
}

let firing = false, fireCooldown = 0;
renderer.domElement.addEventListener('pointermove', setMouse);
renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  setMouse(e);
  if (tool === 'rifle') { firing = true; fire(); fireCooldown = 0.09; }
  else if (tool === 'he') explode();
  else {
    const hit = pick();
    if (hit) {
      const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
      throwSmoke(hit.point.clone().addScaledVector(n, 0.2));
    }
  }
});
addEventListener('pointerup', () => firing = false);

// Start with a grenade next to the doorway so it spills through.
throwSmoke(new THREE.Vector3(-1.5, 0.2, 0));

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const stats = document.getElementById('stats');
const clock = new THREE.Clock();
const SIM_DT = 1 / 30;
let simAcc = 0, fpsAcc = 0, fpsFrames = 0, fps = 0, simMs = 0;
const invVP = new THREE.Matrix4();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  controls.update();

  if (firing && (fireCooldown -= dt) <= 0) { fire(); fireCooldown = 0.09; }

  simAcc += dt;
  if (simAcc >= SIM_DT) {
    const t0 = performance.now();
    while (simAcc >= SIM_DT) { simulate(SIM_DT); simAcc -= SIM_DT; }
    simMs = performance.now() - t0;
  }

  for (let k = tracers.length - 1; k >= 0; k--) {
    const tr = tracers[k];
    tr.life -= dt;
    tr.line.material.opacity = Math.max(0, tr.life / 0.12);
    if (tr.life <= 0) { scene.remove(tr.line); tr.line.geometry.dispose(); tr.line.material.dispose(); tracers.splice(k, 1); }
  }
  flash.intensity *= Math.exp(-dt * 12);

  camera.updateMatrixWorld();
  invVP.multiplyMatrices(camera.matrixWorld, camera.projectionMatrixInverse);
  smokeMat.uniforms.uInvVP.value.copy(invVP);
  smokeMat.uniforms.uCam.value.copy(camera.position);
  smokeMat.uniforms.uTime.value = clock.elapsedTime;

  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(quadScene, quadCam);

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc > 0.5) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; }
  stats.textContent = `${fps.toFixed(0)} fps · sim ${simMs.toFixed(1)} ms · ${activeCells} active voxels · ${grenades.length} grenades`;
});
</script>
</body>
